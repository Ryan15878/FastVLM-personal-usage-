workflows:
  fastvlm-iphone-unsigned:
    name: FastVLM iPhone Unsigned Build

    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest

    cache:
      cache_paths:
        - $CM_BUILD_DIR/app/FastVLM/model
        - $HOME/Library/Caches/org.swift.swiftpm

    scripts:
      - name: Show Xcode project
        script: |
          xcodebuild -list \
            -project "$CM_BUILD_DIR/app/FastVLM.xcodeproj"

      - name: Download FastVLM 0.5B model
        script: |
          MODEL_DIR="$CM_BUILD_DIR/app/FastVLM/model"

          if [ -d "$MODEL_DIR" ] && [ "$(ls -A "$MODEL_DIR" 2>/dev/null)" ]; then
            echo "Model already exists."
          else
            chmod +x "$CM_BUILD_DIR/app/get_pretrained_mlx_model.sh"

            "$CM_BUILD_DIR/app/get_pretrained_mlx_model.sh" \
              --model 0.5b \
              --dest "$MODEL_DIR"
          fi
          
      - name: Install and verify Metal Toolchain
        script: |
          set -e

          echo "=== Select Xcode 26.4 ==="
          sudo xcode-select -s /Applications/Xcode-26.4.app/Contents/Developer

          echo "=== Current Xcode ==="
          xcode-select -p
          xcodebuild -version

          echo "=== Download Metal Toolchain ==="
          xcodebuild -downloadComponent metalToolchain

          echo "=== Locate Metal compiler ==="
          xcrun --sdk iphoneos --find metal

          echo "=== Check Metal compiler ==="
          xcrun --sdk iphoneos metal -v

      - name: Build unsigned iPhone app
        script: |
          xcodebuild build \
            -project "$CM_BUILD_DIR/app/FastVLM.xcodeproj" \
            -scheme "FastVLM App" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/build/Build/Products" \
            -path "*iphoneos*" \
            -name "*.app" \
            -type d \
            | head -1)

          echo "Found app:"
          echo "$APP_PATH"

          mkdir -p "$CM_BUILD_DIR/ipa/Payload"

          cp -R "$APP_PATH" "$CM_BUILD_DIR/ipa/Payload/"

          cd "$CM_BUILD_DIR/ipa"

          zip -r "$CM_BUILD_DIR/FastVLM-unsigned.ipa" Payload

    artifacts:
      - FastVLM-unsigned.ipa
      - build/Build/Products/**/*.app